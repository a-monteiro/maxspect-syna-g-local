apply_manual_preset:
  name: Apply manual preset
  description: Apply a six-channel manual brightness preset to one or all Maxspect Syna-G controllers.
  fields:
    device:
      name: Device
      description: Optional device name or host. If omitted, applies to all configured controllers.
      required: false
      example: aquarium-light-1
      selector:
        text:
    channel_1:
      name: Purplish Blue
      description: Channel 1 brightness percentage.
      required: true
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
    channel_2:
      name: Pool Blue
      description: Channel 2 brightness percentage.
      required: true
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
    channel_3:
      name: Royal Blue + Cool White
      description: Channel 3 brightness percentage.
      required: true
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
    channel_4:
      name: Green
      description: Channel 4 brightness percentage.
      required: true
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
    channel_5:
      name: Warm White
      description: Channel 5 brightness percentage.
      required: true
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
    channel_6:
      name: Red
      description: Channel 6 brightness percentage.
      required: true
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"

backup_schedule:
  name: Backup automatic schedule
  description: Persist the current raw automatic schedule block for one or all Maxspect Syna-G controllers.
  fields:
    device:
      name: Device
      description: Optional device name or host. If omitted, backs up all configured controllers.
      required: false
      example: aquarium-light-1
      selector:
        text:

restore_schedule:
  name: Restore backed up schedule
  description: Restore the last persisted raw automatic schedule block for one or all Maxspect Syna-G controllers.
  fields:
    device:
      name: Device
      description: Optional device name or host. If omitted, restores all configured controllers with backups.
      required: false
      example: aquarium-light-1
      selector:
        text:

apply_lunar_config:
  name: Apply lunar config
  description: Apply known lunar/night-cycle fields while preserving the rest of the raw extension block.
  fields:
    device:
      name: Device
      description: Optional device name or host. If omitted, applies to all configured controllers.
      required: false
      example: aquarium-light-1
      selector:
        text:
    enabled:
      name: Enabled
      description: Enable or disable the lunar cycle flag.
      required: false
      selector:
        boolean:
    high_channels:
      name: Lunar high channels
      description: Three lunar high intensity percentages from the known extension prefix.
      required: false
      example: [100, 100, 100]
      selector:
        object:
    low_channels:
      name: Lunar low channels
      description: Three lunar low intensity percentages from the known extension prefix.
      required: false
      example: [30, 30, 30]
      selector:
        object:
    cycle_day:
      name: Cycle day
      description: Lunar cycle day, 0-29.
      required: false
      selector:
        number:
          min: 0
          max: 29
          step: 1

apply_spectrum_preset:
  name: Apply spectrum preset
  description: Apply an APK-derived R6 spectrum/CCT preset to one or all Maxspect Syna-G controllers.
  fields:
    device:
      name: Device
      description: Optional device name or host. If omitted, applies to all configured controllers.
      required: false
      example: aquarium-light-1
      selector:
        text:
    preset:
      name: Preset
      description: APK-derived spectrum preset name.
      required: true
      example: 16K
      selector:
        select:
          options:
            - 12K
            - 16K
            - 20K
            - Royal Actinic 420
            - Sky Blue
            - Abyss Blue
            - Aquamarine
            - Cyan Actinic
            - Vanuatu Green
            - Fiji Pink
            - Hawaii Purple
    intensity:
      name: Intensity
      description: Optional overall scaling percentage applied to the preset.
      required: false
      default: 100
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
